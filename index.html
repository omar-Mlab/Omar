<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Material Lab – Operations Manager">
<title>Material Lab – Operations Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="lock" hidden></div>
  <aside id="sidebar"></aside>
  <div id="scrim"></div>
  <div id="shell">
    <header id="topbar"></header>
    <main id="main"><div class="boot">Loading…</div></main>
  </div>
  <button id="fab" data-act="quickMenu" aria-label="Quick Actions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
  </button>
  <div id="modals"></div>
  <div id="toast"></div>
  <div id="print"></div>

  <!-- App code (plain JavaScript, no internet needed). Load order matters. -->
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/mat.js"></script>
  <script src="js/views.js"></script>
  <script src="js/datamgmt.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
